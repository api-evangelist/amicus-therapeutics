description: >-
  Amicus Therapeutics is a global rare disease biotechnology company focused on
  discovering, developing, and commercializing medicines for people living with
  genetically defined conditions. Founded in 2002 and headquartered in
  Princeton, New Jersey, Amicus markets two approved therapies: Galafold
  (migalastat) — the first and only oral therapy for adults with Fabry disease
  who have an amenable GLA variant, approved by the European Commission in May
  2016 — and the two-component Pombiliti (cipaglucosidase alfa-atga) + Opfolda
  (miglustat) enzyme replacement / stabilizer combination for adults with
  late-onset Pompe disease. Amicus operates wholly owned subsidiaries in
  Australia, Canada, France, Germany, Italy, Japan, the Netherlands, Spain,
  Switzerland, and the United Kingdom. BioMarin Pharmaceutical Inc. agreed to
  acquire Amicus in December 2025 for $4.8 billion; the acquisition completed
  on April 27, 2026 and Amicus now operates as a wholly owned subsidiary of
  BioMarin, having previously traded on NASDAQ under the ticker FOLD. The
  company maintains no publicly documented commercial developer APIs, SDKs, or
  GitHub organization; its digital surface is composed of corporate, product,
  patient-support, and clinical-trial websites.
